[package]
name = "vidya-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Vidya desktop application (Tauri glue: commands, platform, background)"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vidya_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
tauri = { version = "2.11.3", features = [] }
vidya-services = { path = "../crates/vidya-services" }
tauri-plugin-log = "2.9.1"
thiserror = { workspace = true }
zeroize = "1.9.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
