# cargo-deny configuration (format for cargo-deny 0.20.x).
# Run locally with `VERIFY_DENY=1 npm run verify` (licenses, bans, sources) and
# in CI with `cargo deny check` (all checks, including advisories).

[advisories]
# Security vulnerabilities and `unsound` advisories always fail the build.
# `unmaintained` advisories are scoped to our own workspace crates only: the
# dependency tree of Tauri pulls in a handful of unmaintained-but-not-vulnerable
# transitive crates (the rust-unic family, proc-macro-error) that we cannot fix
# upstream. This keeps CI stable without hiding real vulnerabilities. See
# docs/KNOWN_ISSUES.md.
unmaintained = "workspace"

[licenses]
# Only these SPDX licences are permitted anywhere in the dependency tree.
# Adding a licence here is a deliberate decision — do not widen to make a build
# pass without approval (see AGENTS.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.8

# Our own workspace crates are proprietary and never published (publish = false),
# so their LicenseRef-Proprietary licence is ignored rather than allow-listed.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
# No dependencies from unknown registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
