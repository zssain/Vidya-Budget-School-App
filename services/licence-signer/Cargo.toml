[package]
name = "licence-signer"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Vidya owner portal — isolated licence signer (spec Phase 13). Claims issue_licence jobs and signs v2 licences. No HTTP server."
publish = false
license = "LicenseRef-Proprietary"

# This crate is deliberately its OWN workspace (own Cargo.lock) so it is never
# pulled into the shipped Vidya app build; the root workspace lists it under
# `exclude`, like tools/licence-maker.
[workspace]

[lib]
name = "licence_signer"
path = "src/lib.rs"

[[bin]]
name = "licence-signer"
path = "src/main.rs"

[dependencies]
# The app's own verifier + licence types: the signer builds `LicenceV2` from this
# crate and re-verifies every artefact with `vidya_core::licence::verify_v2`.
vidya-core = { path = "../../crates/vidya-core" }

# Same major versions as vidya-core / tools/licence-maker so one implementation
# signs and verifies (ed25519 is deterministic: same key + bytes = same signature).
ed25519-dalek = "2.2.0"
base64 = "0.22.1"
sha2 = "0.10.9"
zeroize = "1.9.1"
serde_json = "1.0.154"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing"] }
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
# Postgres only, tokio runtime, rustls (ring + webpki roots). NO native-tls/openssl,
# no compile-time-checked macros (no DB needed to build).
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
