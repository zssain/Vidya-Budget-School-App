# Cargo workspace for Vidya (Tauri app + pure-Rust rules crate).
[workspace]
resolver = "2"
members = ["src-tauri", "crates/vidya-core"]
# cloud/* are standalone dev/company services (their own Cargo.toml + [workspace]);
# they must never be pulled into the shipped app build (prompts/P03 Step 2).
# cloud/_archive/licence is the RETIRED v2 licence server (prompts/P12 Step 8).
# tools/licence-maker is the owner's laptop-only licence tool — never shipped or
# built by the app workspace (prompts/P12 Step 7); it has its own [workspace].
exclude = ["cloud/_archive", "cloud/relay", "tools/licence-maker"]

# Release profile tuned for size (see docs/00-SYSTEM-CONTEXT.md §2 limits).
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
