[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
