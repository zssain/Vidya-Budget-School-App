name: Release

# Cut a release (prompts/P09 §9). Pushing a tag `v1.2.3` builds every platform,
# renames artifacts to the §2 names, measures installed size, attaches them to a
# DRAFT GitHub Release, then adds SHA256SUMS.txt.
#
# SIGNING (owner decision, P09 follow-up): Windows and macOS ship UNSIGNED for
# v1.0.0 — the WINDOWS_*/APPLE_* secrets are optional and, when absent, the signing
# steps are skipped cleanly, the artifact filename gets a `-UNSIGNED` suffix and the
# release notes carry an "Unsigned build" banner (rule 6 — never fake a signature).
# Android is debug-signed `-UNSIGNED-TEST` until the owner adds the keystore secrets.
#
# BUILD-CONFIG (required): the non-secret build-config values are read from repo
# Variables and written to build-config/release.json before each build; a missing
# value fails the job with a clear message (build.rs is the backstop and also
# refuses the dev licence key). v2 (Phase 12): there is NO LICENCE_API — licences
# verify offline; LICENCE_PUBLIC_KEY_PREV and RELAY_URL are optional. Only §4
# allow-listed actions are used; the cross-job SHA256SUMS uses the preinstalled
# `gh` CLI (no download-artifact). The final job also writes site/releases.json on
# the default branch so the static download page (site/) lists this release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---- macOS: universal DMG ------------------------------------------------
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Sync version from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Write build-config/release.json (fail if any value is missing)
        shell: bash
        env:
          LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
          LICENCE_PUBLIC_KEY_PREV: ${{ vars.LICENCE_PUBLIC_KEY_PREV }}
          RELAY_URL: ${{ vars.RELAY_URL }}
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
        run: bash scripts/write-release-config.sh
      # Signing + notarization run ONLY if the Apple secrets are present; absent →
      # unsigned build, no error.
      - name: Build universal DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg app
      - name: Rename (flag unsigned)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          SUFFIX=""; [ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ] && SUFFIX="-UNSIGNED"
          mkdir -p out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Vidya_${VER}_universal${SUFFIX}.dmg"
      - name: Installed-size gate (.app bundle)
        run: node scripts/size-report.mjs
      - name: Attach to DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Vidya ${{ github.ref_name }}
          files: out/*

  # ---- Windows: NSIS setup -------------------------------------------------
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Sync version from the tag
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Write build-config/release.json (fail if any value is missing)
        shell: bash
        env:
          LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
          LICENCE_PUBLIC_KEY_PREV: ${{ vars.LICENCE_PUBLIC_KEY_PREV }}
          RELAY_URL: ${{ vars.RELAY_URL }}
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
        run: bash scripts/write-release-config.sh
      # NOTE (cloud signing): the classic PFX-in-a-secret approach used by these
      # env vars only works for older certificates. Windows code-signing certs
      # issued from mid-2023 onward keep the private key on a hardware token or a
      # cloud signing service (Azure Trusted Signing / a CA's cloud HSM), so
      # signtool must call that service instead of a local .pfx. Revisit this step
      # with a cloud-signing integration when the owner buys a certificate.
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri build -- --bundles nsis
      - name: Measure installed footprint + rename
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'vidya-installed'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Start-Process -FilePath $exe.FullName -ArgumentList "/S","/D=$dir" -Wait
          $bytes = (Get-ChildItem $dir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Set-Content -NoNewline -Path scripts/.windows-installed-bytes -Value $bytes
          $suffix = ""; if (-not "${{ secrets.WINDOWS_CERTIFICATE }}") { $suffix = "-UNSIGNED" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $exe.FullName "out/Vidya_${ver}_x64-setup$suffix.exe"
      - name: Size gate
        run: node scripts/size-report.mjs
      - name: Attach to DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Vidya ${{ github.ref_name }}
          files: out/*

  # ---- Android: split APKs per ABI ----------------------------------------
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: npm ci
      - name: Sync version from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Write build-config/release.json (fail if any value is missing)
        env:
          LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
          LICENCE_PUBLIC_KEY_PREV: ${{ vars.LICENCE_PUBLIC_KEY_PREV }}
          RELAY_URL: ${{ vars.RELAY_URL }}
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
        run: bash scripts/write-release-config.sh
      - name: Write keystore.properties if the keystore secret exists
        id: ks
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vidya.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/vidya.keystore"
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > src-tauri/gen/android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build split APKs
        run: npm run tauri android build -- --apk --split-per-abi
      - name: Rename APKs (flag debug-signed test builds)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          SUFFIX=""; [ "${{ steps.ks.outputs.signed }}" = "false" ] && SUFFIX="-UNSIGNED-TEST"
          mkdir -p out
          BASE=src-tauri/gen/android/app/build/outputs/apk
          for abi in arm64-v8a armeabi-v7a; do
            f=$(find "$BASE" -name "*${abi}*.apk" | head -1)
            [ -n "$f" ] && cp "$f" "out/Vidya_${VER}_${abi}${SUFFIX}.apk"
          done
      - name: Size gate
        run: node scripts/size-report.mjs
      - name: Attach to DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Vidya ${{ github.ref_name }}
          files: out/*

  # ---- SHA256SUMS.txt + release notes over every attached asset -----------
  checksums:
    name: SHA256SUMS + notes
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" -D release --clobber
          ( cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
      - name: Compose release notes (unsigned banner + CHANGELOG)
        run: |
          {
            echo "> **Unsigned build** — Windows and macOS are not code-signed for this"
            echo "> release. See INSTALL.md for the one-time security prompt (Windows:"
            echo "> \"More info → Run anyway\"; macOS: right-click → Open / Privacy &"
            echo "> Security → Open Anyway). Android APKs suffixed \`-UNSIGNED-TEST\` are"
            echo "> debug-signed test builds."
            echo ""
            echo "Published by Zuhair Hussain · support: mohammedzuhairhussain28@gmail.com · zuhairhussain.com"
            echo ""
            echo "---"
            echo ""
            cat CHANGELOG.md
          } > release-notes.md
      - name: Attach SHA256SUMS.txt + set notes on the DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Vidya ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/SHA256SUMS.txt
      # Write site/releases.json on the default branch so the static Downloads page
      # (site/downloads.html) lists this release (prompts/P12 Step 9). No deploy —
      # GitHub/Cloudflare Pages picks up the committed file (docs/DEPLOY-SITE.md).
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Update site/releases.json on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%F)"
          rm -rf pages
          git clone --depth 1 --branch "$DEFAULT_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          node scripts/write-site-releases.mjs release "$VER" "$DATE" "$GITHUB_REPOSITORY" pages/site/releases.json
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/releases.json; then
            echo "site/releases.json unchanged — nothing to commit"
          else
            git add site/releases.json
            git commit -m "release: update site/releases.json for ${GITHUB_REF_NAME}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
