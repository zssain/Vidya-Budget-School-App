name: CI

# Push/PR gate (prompts/P09 §9): tsc, vitest, cargo test, clippy, check scripts,
# a build, and the size report. Only the §4 allow-listed actions are used
# (checkout, setup-node, rust-toolchain, setup-java, setup-android, tauri-action,
# upload-artifact, action-gh-release) — no caching or install actions.

on:
  push:
  pull_request:

jobs:
  # ---- Fast, platform-independent gate ------------------------------------
  checks:
    name: checks — tsc · vitest · check scripts · cargo test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux build prerequisites (webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # tsc + check:hex + check:i18n + check:deps + check:version + check:contrast
      # + check:logs + vitest
      - run: npm run verify

      # Build the frontend and prove no dev routes/seed/fixtures/dev keys leak.
      - name: Release-artifact cleanliness
        run: npm run check:release-clean

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Crypto gate — ring only, no aws-lc-rs
        run: |
          if cargo tree -i aws-lc-rs 2>/dev/null | grep -q aws-lc-rs; then
            echo "aws-lc-rs is linked — §13 forbids it (ring must be the sole provider)"; exit 1
          fi
          echo "OK — aws-lc-rs is absent."

  # ---- Supply-chain advisories (tools, not dependencies) ------------------
  audit:
    name: audit — cargo audit · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: dtolnay/rust-toolchain@stable
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ---- Real bundle + size gate: macOS -------------------------------------
  macos:
    name: macOS — build · size gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: CI-only build config (throwaway licence key — not a release)
        run: node scripts/write-ci-config.mjs
      - name: Build Apple Silicon DMG
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg app
      - name: Size gate (download ≤ 40 MB, installed ≤ 50 MB)
        run: node scripts/size-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: size-macos
          path: size-report.json
          if-no-files-found: error

  # ---- Real bundle + size gate: Windows -----------------------------------
  windows:
    name: Windows — installer · size gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: CI-only build config (throwaway licence key — not a release)
        run: node scripts/write-ci-config.mjs
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Measure NSIS silent-install footprint (installed size)
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'vidya-installed'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Start-Process -FilePath $exe.FullName -ArgumentList "/S","/D=$dir" -Wait
          $bytes = (Get-ChildItem $dir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Set-Content -NoNewline -Path scripts/.windows-installed-bytes -Value $bytes
      - name: Size gate (download ≤ 40 MB, installed ≤ 50 MB)
        run: node scripts/size-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          # CI-only build (throwaway licence key): never distribute this artifact.
          name: vidya-windows-installer-CI-ONLY-not-a-release
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: size-windows
          path: size-report.json
          if-no-files-found: error

  # ---- Android debug build + size report ----------------------------------
  android:
    name: Android — split APKs · size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # setup-android@v3 defaults fail on the current runner two ways: its own
      # `sdkmanager --licenses` errors mid-accept, and its default package set includes
      # the obsolete `tools` package ("Failed to find package 'tools'" → exit 1). So
      # disable both and accept + install exactly what we need manually below.
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept SDK licenses + ensure API 36 packages + NDK (incl. OpenSSL cross tools)
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          # Tauri needs the NDK; use the runner's preinstalled one.
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          # rusqlite(bundled-sqlcipher-vendored-openssl) builds OpenSSL from source for
          # Android; its Makefile calls <triple>-ranlib/-ar, which NDK r23+ renamed to
          # llvm-*. Symlink the old names to the llvm tools and put the toolchain on PATH.
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi; do
            ln -sf "$TC/llvm-ranlib" "$TC/${t}-ranlib"
            ln -sf "$TC/llvm-ar" "$TC/${t}-ar"
          done
          echo "$TC" >> "$GITHUB_PATH"
          echo "using NDK at: $NDK (toolchain: $TC)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: npm ci
      # Release profile, unsigned (no keystore in CI), ARM only — what phones get, so
      # the size gate measures the real download. A debug build is 270–770 MB per ABI
      # (unstripped symbols) and x86/x86_64 are emulator-only, as in release.yml.
      - name: Build split APKs (release profile, unsigned, ARM only)
        run: npm run tauri android build -- --apk --split-per-abi --target aarch64 --target armv7
      - name: Size gate (download ≤ 40 MB, installed ≤ 50 MB)
        run: node scripts/size-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: size-android
          path: size-report.json
          if-no-files-found: error
