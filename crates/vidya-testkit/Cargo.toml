[package]
name = "vidya-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Test fixtures and the sample school. Depends only on the crates it actually
# uses (core, db, services); the simulation harness re-adds sync/server/client
# etc. in P7.4. Used as a dev-dependency, and (debug-only) by src-tauri's
# load_sample_school command.
[dependencies]
chrono = { workspace = true }
rand = "0.9"
rusqlite = { workspace = true }
vidya-core = { path = "../vidya-core" }
vidya-db = { path = "../vidya-db" }
vidya-services = { path = "../vidya-services" }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = { workspace = true }
