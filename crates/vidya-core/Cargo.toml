[package]
name = "vidya-core"
version = "2.0.0"
edition = "2021"
description = "Vidya business rules — pure Rust, no IO, no async, no database."

# vidya-core may depend ONLY on these (prompts/P02 Step 1).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
uuid = { version = "1", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
# Sealing primitives shared with the PWA (§18): pure AEAD + HKDF. No `rand` here —
# the caller supplies the nonce (OsRng native / WebCrypto in the browser), so
# vidya-core stays IO-free and compiles to wasm32.
chacha20poly1305 = "0.10"
hmac = "0.12"
# PIN hashing (Argon2id) shared with the PWA (§9, §18). Pure: the salt is supplied
# by the caller, so no `rand` here; compiles to wasm32.
argon2 = "0.5"

# On wasm32 the transitive `getrandom` (via rand_core, pulled by chacha20poly1305/
# argon2/ed25519-dalek) needs its `js` backend to compile — it wires to the browser
# WebCrypto `crypto.getRandomValues`. This is the wasm randomness backend for the
# §13-allowed rand/argon2/aead crates; it is NOT compiled for native targets. vidya
# core still never *calls* it (the salt/nonce are caller-supplied) — it only needs
# to link on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
