# Fly.io config for the Vidya licence service (prompts/P09 §8, docs/DEPLOY-FLY.md).
# The owner runs `fly launch --no-deploy` in this directory (it has a Dockerfile),
# keeping/adjusting this file. Rename `app` if the name is taken. Deploy is an
# OWNER action — nothing here deploys automatically.
#
# Persistent storage: the code/licence store lives on a Fly VOLUME mounted at
# /data (LICENCE_DATA_DIR). Create it once:  fly volumes create vidya_licence_data --size 1
# Secrets (fly secrets set ...): LICENCE_SIGNING_KEY (the PRODUCTION private key
# from `gen-prod-key`), RELAY_SHARED_KEY (same as the relay). Back up the volume
# with `fly volumes snapshots` — see docs/DEPLOY-FLY.md.

app = "vidya-licence"
primary_region = "bom"   # Mumbai (closest to India; fall back to "sin" if unavailable)

[build]
  dockerfile = "Dockerfile"

[env]
  LICENCE_BIND = "0.0.0.0"
  LICENCE_PORT = "8787"
  LICENCE_DATA_DIR = "/data"

[mounts]
  source = "vidya_licence_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true           # the app reaches it over https://
  auto_stop_machines = "off"   # always on
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"       # smallest shared-CPU machine
  memory = "256mb"
