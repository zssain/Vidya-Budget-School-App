# Vidya dev licence service (prompts/P03 Step 2). A SEPARATE binary — NOT a member
# of the app workspace, so it never ships inside the desktop/Android apps. Phase 10
# turns this into the production service.
[package]
name = "vidya-licence"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace so `cargo` here never touches the app workspace.
[workspace]

[[bin]]
name = "vidya-licence"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
rand = "0.8"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
# P05: the relay secret is HMAC-SHA256(shared_key, school_id) — the same recipe
# cloud/relay recomputes to verify a tunnel, so the relay stays stateless.
hmac = "0.12"
sha2 = "0.10"
